<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

 *{
    margin:0;
    padding:0;
    box-sizing:border-box;}

/* Body */
body{
    font-family: Arial, sans-serif;
    background:#f8fafc;
    color:#111;
}

/* Navigation */
nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px;
   background: 
    #cbeef3;
   box-shadow:0px 5px 20px rgba(0,0,0,0.35);

    position:relative;
    z-index:100;
}



nav h1{
    color:rgb(0, 0, 0);
}

nav ul{
    display:flex;
    list-style:none;
    gap:20px;
}

nav a{
    color:rgb(2, 2, 2);
    text-decoration:none;
}

.contact{
   padding:200px 100px;
    text-align:center;
    background-image: url(./images/wizard.jpg);
    background-size: cover;
background-position: center;
background-repeat: no-repeat;
color: #ffffff;
}

.contact h1{
    font-size:50px;
    margin-bottom:20px;
}

.contact-container{
    display:flex;
    justify-content:center;
    gap:60px;
    flex-wrap:wrap;
    margin-top:40px;
}

/* FORM */
form{
    display:flex;
    flex-direction:column;
    width:350px;
}

form input,
form textarea{
    margin-bottom:15px;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
}

form button{
    padding:12px;
    background:#cbeef3;
    border:none;
    border-radius:25px;
    cursor:pointer;
}

/* INFO */
.contact-info{
    text-align:left;
    max-width:300px;
}

.contact-info h3{
    margin-bottom:15px;
}

/* Footer */
footer{
    background: #cbeef3;

    color:rgb(0, 0, 0);
    text-align:center;
    padding:20px;
     box-shadow:0px 5px 20px rgba(0,0,0,0.35);

    position:relative;
    z-index:100; }


</style>
<body>

 <!-- Header -->
    <header>
        <nav>
            <h1>Fine ART
            </h1>

            <ul>
                <li ><a href="./index.html">Home</a></li>
                <li><a href="./about.html">About</a></li>
                <li><a href="./sevices.html">Services</a></li>
                <li><a style="font-weight: bold; " href="./contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

<section class="contact">

    <h1>Contact Me</h1>

    <p>
        Let’s work together! Feel free to reach out for commissions,
        design projects, or collaborations.
    </p>

    <div class="contact-container">

        <!-- FORM -->
        <form>

            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>

            <textarea placeholder="Your Message" rows="6"></textarea>

            <button type="submit">Send Message</button>

        </form>

        <!-- INFO -->
        <div class="contact-info">

            <h3>Get in Touch</h3>

            <p>Email: noora@example.com</p>
            <p>Instagram: @fineartsby_noora</p>
            <p>Location: Riyadh / Saudi Arabia </p>

        </div>

    </div>

</section>

 <!-- Footer -->
    <footer>
        <p>© 2026 Fine Arts By Noora</p>
    </footer> 


</body>
</html>
